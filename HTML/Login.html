<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Gymbrot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lexend:wght@500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="GymBrot-1\CSS\gymbrot.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>GYMBROT</h1>
      <h2>Iniciar sesión</h2>
      <input class="form-control-dark" id="username" type="text" placeholder="Usuario" autocomplete="username" />
      <input class="form-control-dark" id="password" type="password" placeholder="Contraseña" autocomplete="current-password" />
      <button class="btn-login" type="submit">Entrar</button>
      <p class="login-hint">Ingreso: admin / admin</p>
    </form>
  </div>

  <script src="GymBrot-1\JS\api.js"></script>
  <script src="GymBrot-1\JS\auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;
      if (auth.login(user, pass)) {
        window.location.href = "dashboard.html";
      } else {
        alert("Usuario o contraseña incorrectos");
      }
    });
  </script>
</body>
</html>

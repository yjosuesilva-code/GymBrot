<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Instructores - GYMBROT</title>
        <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800;900&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- CSS propio del proyecto -->
    <link rel="stylesheet" href="css/styles.css">

</head>
<body>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Gestión de Instructores</h1>
            <button type="button" class="btn btn-neon" id="btnNuevoInstructor">
                <i class="bi bi-plus-lg"></i> Nuevo instructor
            </button>
        </div>

        <table class="table table-dark">
            <thead>
                <tr>
                    <th>Identificación</th>
                    <th>Nombre</th>
                    <th>Especialidad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaInstructores">
                <!-- Aquí JavaScript va a insertar las filas -->
            </tbody>
        </table>

        <div class="modal fade" id="modalInstructor" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nuevo instructor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formInstructor">
                    <div class="mb-3">
                        <label class="form-label">Identificación</label>
                        <input type="text" class="form-control" id="inputId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="inputNombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="inputApellidos" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Especialidad</label>
                        <input type="text" class="form-control" id="inputEspecialidad" required>
                    </div>
                    <button type="submit" class="btn btn-neon">Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>
    </div>

    <script src="js/instructores.js"></script>
</body>
</body>
</html>

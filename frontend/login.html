<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · GYMBROT</title>
 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lexend:wght@500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/gymbrot.css" />
</head>
<body>
  <div class="d-flex align-items-center justify-content-center" style="min-height:100vh; padding:24px;">
    <form id="login-form" class="card-g" style="max-width:400px; width:100%; text-align:center;">
 
      <div style="font-family:var(--f-title); font-weight:900; font-style:italic; font-size:32px; color:var(--neon); margin-bottom:4px;">GYMBROT</div>
      <p class="card-sub" style="margin-bottom:24px;">Iniciar sesión</p>
 
      <div class="alert-g alert-error" id="login-error">Usuario o contraseña incorrectos</div>
 
      <input class="form-control-dark" id="username" type="text" placeholder="Usuario" autocomplete="username" style="margin-bottom:12px;" />
      <input class="form-control-dark" id="password" type="password" placeholder="Contraseña" autocomplete="current-password" style="margin-bottom:16px;" />
      <button class="btn-neon" type="submit" style="width:100%; padding:12px;">Entrar</button>
 
      <p class="card-sub" style="margin-top:16px;">Ingreso de prueba: admin / admin</p>
    </form>
  </div>
 
  <!-- Scripts (ruta correcta: minúsculas y sin ../) -->
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;
      if (auth.login(user, pass)) {
        // Por ahora entra a clientes (tu vista lista). Cuando el dashboard esté
        // integrado con la base compartida, cámbialo a "dashboard.html".
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("login-error").classList.add("show");
      }
    });
  </script>
</body>
</html>
